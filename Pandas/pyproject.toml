[project]
name = "pandas-101"
version = "0.1.0"
description = "Basic pandas examples to support the flocode newsletter - '#027 - Data Structures for Civil/Structural Engineers: Pandas 101'"
authors = [{name = "James O'Reilly", email = "joreilly86@gmail.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.0.1",
    "matplotlib>=3.10.8",
    "openpyxl>=3.1.5"
]

[dependency-groups]
dev = [
    "ruff>=0.15.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
