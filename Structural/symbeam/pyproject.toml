[project]
name = "symbeam_beam_examples"
version = "0.1.0"
description = "Symbeam examples"
authors = [{name = "joreilly86", email = "joreilly86@gmail.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "symbeam>=2.1.2",
    "matplotlib>=3.10.8"
]

[dependency-groups]
dev = [
    "ruff>=0.15.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
