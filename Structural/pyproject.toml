[project]
name = "structural-examples"
version = "0.1.0"
description = "Basic Examples showing Python use cases in Structural Engineering"
authors = [{name = "James O'Reilly", email = "joreilly86@gmail.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10.8",
    "pandas>=3.0.1",
    "numpy>=2.4.3",
    "PyNiteFEA>=2.4.1",
    "seaborn>=0.13.2",
    "openpyxl>=3.1.5"
]

[dependency-groups]
dev = [
    "ruff>=0.15.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
